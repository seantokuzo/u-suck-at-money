name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# SETUP REQUIRED:
# 1. Install the Claude GitHub App: run `/install-github-app` in Claude Code terminal
# 2. Or manually: https://github.com/apps/claude
# 3. Add ANTHROPIC_API_KEY to repo secrets (Settings > Secrets > Actions)

jobs:
  claude-review:
    # Run on PR events, or on PR comments that mention @claude
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Review trigger: auto-review on every PR push
          # Comment trigger: respond when someone @mentions claude
          trigger_phrase: "@claude"

          # Optional: customize the review prompt
          # direct_prompt: "Review this PR for bugs, security issues, and adherence to project conventions in CLAUDE.md"

          # Optional: limit to specific file patterns
          # allowed_tools: "Read,Grep,Glob,WebSearch"

          # Optional: use a specific model
          # model: "claude-sonnet-4-20250514"
